name: Reconstruct COSMOS source

on:
  push:
    branches:
      - cleanup/professionalize-cosmos-2026
    paths:
      - '.github/workflows/reconstruct.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand tested source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .rebuild/chunk-* | base64 -d > /tmp/cosmos.tar.gz
          tar -xzf /tmp/cosmos.tar.gz
          rm -f COMPARED.md
          rm -rf .rebuild
          rm -f .github/workflows/reconstruct.yml

      - name: Commit source reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reconstruction changes to commit."
            exit 0
          fi
          git commit -m "feat: rebuild COSMOS as source-first tested runtime"
          git push origin HEAD:cleanup/professionalize-cosmos-2026
