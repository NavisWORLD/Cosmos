name: Reconstruct COSMOS source

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  reconstruct:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/professionalize-cosmos-2026
          fetch-depth: 0

      - name: Expand tested source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .rebuild/chunk-00 \
            .rebuild/chunk-01 \
            .rebuild/chunk-02a \
            .rebuild/chunk-02b \
            .rebuild/chunk-03 \
            .rebuild/chunk-04 \
            .rebuild/chunk-05 \
            | base64 -d > /tmp/cosmos.tar.gz
          echo "7abfb6955c4c6a343792d02ce01d2e5a7f2ada9cf3cdd91391a593817cb96728  /tmp/cosmos.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cosmos.tar.gz
          rm -f COMPARED.md
          rm -rf .rebuild
          rm -f .github/workflows/reconstruct.yml
          rm -f .github/workflows/ci.yml

      - name: Commit source reconstruction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reconstruction changes to commit."
            exit 0
          fi
          git commit -m "feat: rebuild COSMOS as source-first tested runtime"
          git push origin HEAD:cleanup/professionalize-cosmos-2026
