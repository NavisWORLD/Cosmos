[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-cst"
version = "3.0.1"
description = "COSMOS: local-first experimental cognitive runtime and Davis CST engineering toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Cory Shane Davis"}]
keywords = ["cosmos", "cst", "local-ai", "memory", "dynamic-state", "hebbian", "evidence"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
embeddings = ["sentence-transformers>=3.0"]
ml = ["numpy>=1.24", "torch>=2.2", "transformers>=4.38"]
web = ["fastapi>=0.115", "uvicorn>=0.32"]
quantum = ["qiskit>=1.0"]
sensory = ["numpy>=1.24", "sounddevice>=0.4.6", "pillow>=10"]
full = [
  "sentence-transformers>=3.0",
  "numpy>=1.24",
  "torch>=2.2",
  "transformers>=4.38",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "qiskit>=1.0",
  "sounddevice>=0.4.6",
  "pillow>=10",
]

[project.scripts]
cosmos = "cosmos.cli:main"

[tool.setuptools.packages.find]
include = ["cosmos*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
